<html>
    <body>
        <header>
            <h1> DOM </h1> <!-- In memory, this is not a text, it is an instance of some class (HTMLHeadingElement)-->

            <p class="tagline">
                Document Object Model
            </p>

            <img hidden src="dom.png">
        </header>
    </body>
</html>


<!-- 
Each element is represented by an object of HTMLElement Interface (Svaki element postaje objekat u memoriji)
Objects have methods and properties (ex. className, innerHTML, appendChild(), remove())..
Changes in properties or children will trigger updates in the user interface when you release the thread
-->
